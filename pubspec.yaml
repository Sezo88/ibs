name: ibs_semptom_takip
description: "IBS Semptom Takip - FODMAP Eliminasyon Gıda & Semptom Günlüğü"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1

  # Charts
  fl_chart: ^0.70.2

  # PDF export
  pdf: ^3.11.2
  printing: ^5.14.2

  # CSV export
  share_plus: ^10.1.4
  csv: ^6.0.0

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Date formatting
  intl: ^0.19.0

  # Timezone (for notifications)
  timezone: ^0.10.0

  # File operations
  file_picker: ^8.1.7

  # Image picker (for meal photos)
  image_picker: ^1.1.2

  # Barcode scanning (v2 feature, but add now)
  mobile_scanner: ^6.0.3

  # UUID
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/
